<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCall V-3 — Simple Clinic Booking</title>

  <!-- Modular Folder-Driven CSS -->
  <link rel="stylesheet" href="./css/base/reset.css">
  <link rel="stylesheet" href="./css/header/header.css">
  <link rel="stylesheet" href="./css/slots/slots.css">
  <link rel="stylesheet" href="./css/form/form.css">
  <link rel="stylesheet" href="./css/confirmation/confirmation.css">
</head>
<body>
  <div class="screen-container">
    <!-- Slim Horizontal Topbar -->
    <header class="slim-topbar">
      <div class="slim-title" id="topBarTitle">🩺 Clinic Booking</div>
      <div class="slim-details" id="topBarDetails">
        <span>Loading session...</span>
      </div>
    </header>

    <!-- 50 / 50 Equal Split Body (Zero-Scroll) -->
    <main class="body-split">
      <!-- LEFT 50%: 6 Slot Cards (2x3 Grid) -->
      <section class="left-slots-pane">
        <div class="slots-grid-2x3" id="slotsGrid">
          <!-- Rendered dynamically by dom.js -->
        </div>
      </section>

      <!-- RIGHT 50%: Fast Booking Form & Confirmation -->
      <section class="right-booking-pane">
        <!-- Top Slot Indicator -->
        <div class="selected-slot-indicator">
          <span>Booking for Slot:</span>
          <strong id="selectedSlotIndicator">Loading slot...</strong>
        </div>

        <!-- Form -->
        <form id="bookingForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="patientName">Patient Full Name *</label>
            <input
              type="text"
              id="patientName"
              class="form-input"
              placeholder="e.g. Ramesh Kumar"
              required
              autofocus
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="phoneNumber">Mobile Number (10 digits) *</label>
            <input
              type="tel"
              id="phoneNumber"
              class="form-input"
              placeholder="e.g. 9848163021"
              pattern="[0-9]{10}"
              required
            >
          </div>

          <button type="submit" class="btn-book-submit" id="btnBookSubmit">
            🎟 BOOK SLOT (Enter)
          </button>
        </form>

        <!-- Instant Confirmation Box (Appears right below on submit) -->
        <div class="confirmation-box" id="confirmationBox">
          <div class="token-badge-small" id="confirmTokenBadge">#</div>
          <div>
            <div class="confirmation-msg-title">✅ Booking Confirmed!</div>
            <div class="confirmation-msg-desc" id="confirmMsgDesc">-</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Entry Script using Declarative bindings.json & actions.js -->
  <script type="module" src="./js/index.js"></script>
</body>
</html>
