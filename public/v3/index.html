<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCall V-3 — Simple Clinic Booking</title>

  <!-- Modular Folder-Driven CSS -->
  <link rel="stylesheet" href="./css/base/reset.css">
  <link rel="stylesheet" href="./css/header/header.css">
  <link rel="stylesheet" href="./css/slots/slots.css">
  <link rel="stylesheet" href="./css/form/form.css">
  <link rel="stylesheet" href="./css/confirmation/confirmation.css">
  <style>
    .breadcrumb-nav {
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    .breadcrumb-nav a {
      color: var(--accent-blue);
      text-decoration: none;
    }
    .breadcrumb-nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- Back to Gateway -->
    <div class="breadcrumb-nav">
      <a href="../">← CareCall Gateway</a>
    </div>

    <!-- Header -->
    <header class="app-header">
      <span class="brand-badge">CareCall V-3 &bull; Fast Phone Intake</span>
      <h1 class="brand-title">Clinic Appointment Booking</h1>
      <p class="brand-subtitle" id="headerSubtitle">Loading doctor hours...</p>
    </header>

    <!-- Instant Confirmation Banner -->
    <section class="confirmation-banner" id="confirmationBanner">
      <div class="confirmation-content">
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="token-circle-badge" id="confirmToken">1</div>
          <div class="confirmation-text">
            <h3>✅ Appointment Confirmed!</h3>
            <p id="confirmDetails">-</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 1. Slot Selector Cards -->
    <section>
      <h2 class="section-title">1. Select a Time Slot</h2>
      <div class="slots-grid" id="slotsGrid">
        <!-- Rendered by dom.js -->
      </div>
    </section>

    <!-- 2. Fast Phone Booking Form -->
    <section class="booking-section">
      <div class="selected-slot-banner">
        <span>Booking for Slot:</span>
        <strong id="selectedSlotName">Loading slot...</strong>
      </div>

      <form id="bookingForm" autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="patientName">Patient Full Name *</label>
            <input
              type="text"
              id="patientName"
              class="form-input"
              placeholder="e.g. Ramesh Kumar"
              required
              autofocus
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="phoneNumber">Mobile Number (10 digits) *</label>
            <input
              type="tel"
              id="phoneNumber"
              class="form-input"
              placeholder="e.g. 9848163021"
              pattern="[0-9]{10}"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-book" id="btnBookSubmit">
          🎟 Confirm & Book Appointment
        </button>
      </form>
    </section>
  </div>

  <!-- Entry Script using Declarative bindings.json & actions.js -->
  <script type="module" src="./js/index.js"></script>
</body>
</html>
