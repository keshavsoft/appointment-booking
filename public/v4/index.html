<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCall V-4 — Split Tabular Roster & Fast Intake</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Polish CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Topbar -->
  <header class="clinic-topbar shadow-sm">
    <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <a href="../" class="btn btn-outline-secondary btn-sm py-1 px-2" title="Back to Gateway">
          <i class="bi bi-arrow-left"></i> Hub
        </a>
        <div>
          <div class="topbar-brand" id="sessionDoctorTitle">🩺 Dr. Aditya</div>
          <small class="text-muted" id="sessionClinicTitle">CareCall Clinic Consultation</small>
        </div>
      </div>

      <!-- Live Counters & Shortcuts -->
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span id="sessionDateBadge" class="stat-chip">📅 Today</span>
        <span class="stat-chip bg-white">
          <i class="bi bi-people-fill text-secondary me-1"></i> Total: <strong id="statTotalPatients">0</strong>
        </span>
        <span class="stat-chip bg-white text-warning">
          <i class="bi bi-hourglass-split me-1"></i> Waiting: <strong id="statWaitingPatients">0</strong>
        </span>
        <span class="stat-chip bg-white text-primary">
          <i class="bi bi-person-badge-fill me-1"></i> In Consult: <strong id="statConsultPatients">0</strong>
        </span>

        <button type="button" class="btn btn-sm btn-outline-primary ms-2" id="btnSeedData">
          <i class="bi bi-lightning-charge-fill"></i> Load Samples
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger" id="btnClearToday">
          <i class="bi bi-trash3"></i> Clear Today
        </button>
      </div>
    </div>
  </header>

  <!-- Main Split Body -->
  <main class="container-fluid py-4">
    <!-- Action / Flash Notification Banner -->
    <div id="actionNotificationBanner" style="display: none;"></div>

    <div class="row g-4">
      <!-- LEFT 65%: Live Tabular Roster -->
      <section class="col-lg-8">
        <div class="table-pane-card">
          <div class="table-pane-header">
            <div>
              <h5 class="fw-bold mb-0 text-dark">📋 Today's Patient Queue</h5>
              <small class="text-muted">Live appointments table powered by <code>json-renderers-build-table</code></small>
            </div>
            <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-bold">
              Tabular Roster
            </span>
          </div>

          <!-- Table Container populated by table.js -->
          <div class="p-3">
            <div id="left-table-content"></div>
          </div>
        </div>
      </section>

      <!-- RIGHT 35%: Vertical Fast Intake Form -->
      <section class="col-lg-4">
        <div class="form-sticky-pane">
          <!-- Form Container populated by form.js via json-renderers-run-instructions-steps -->
          <div id="right-form-content"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Entry Script using dom-primitive-bindings & declarative json pipelines -->
  <script type="module" src="./js/index.js"></script>
</body>
</html>
